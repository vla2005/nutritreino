name: nutritreino

x-api-environment: &api-environment
  APP_NAME: ${APP_NAME:-NutriTreino}
  APP_ENV: production
  APP_KEY: ${APP_KEY:-}
  APP_DEBUG: "false"
  APP_URL: ${APP_URL:-http://localhost:8080}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-warning}
  DB_CONNECTION: mysql
  DB_HOST: database
  DB_PORT: 3306
  DB_DATABASE: ${DOCKER_DB_DATABASE:-nutritreino}
  DB_USERNAME: ${DOCKER_DB_USERNAME:-nutritreino}
  DB_PASSWORD: ${DOCKER_DB_PASSWORD:-change-me}
  SESSION_DRIVER: database
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  FILESYSTEM_DISK: local
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
  SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost:8080,127.0.0.1:8080}
  BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-log}
  PUSHER_APP_ID: ${PUSHER_APP_ID:-}
  PUSHER_APP_KEY: ${PUSHER_APP_KEY:-}
  PUSHER_APP_SECRET: ${PUSHER_APP_SECRET:-}
  PUSHER_APP_CLUSTER: ${PUSHER_APP_CLUSTER:-mt1}
  PUSHER_SCHEME: https
  PUSHER_PORT: 443
  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_SCHEME: ${MAIL_SCHEME:-}
  MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
  MAIL_PORT: ${MAIL_PORT:-2525}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@localhost}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-NutriTreino}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}

x-api-service: &api-service
  image: nutritreino-api:local
  environment: *api-environment
  volumes:
    - api_storage:/app/storage
  init: true
  restart: unless-stopped

services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DOCKER_DB_DATABASE:-nutritreino}
      MYSQL_USER: ${DOCKER_DB_USERNAME:-nutritreino}
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:-change-me}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    command:
      - --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL_SIZE:-256M}
      - --max-connections=${MYSQL_MAX_CONNECTIONS:-100}
      - --performance-schema=OFF
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  migrate:
    <<: *api-service
    command: ["php", "artisan", "migrate", "--force", "--no-interaction"]
    depends_on:
      database:
        condition: service_healthy
    restart: "no"
    healthcheck:
      disable: true

  api:
    <<: *api-service
    build:
      context: ./api
    command: ["frankenphp", "run", "--config", "/etc/caddy/Caddyfile"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "php", "/usr/local/bin/nutritreino-healthcheck.php", "api"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  queue:
    <<: *api-service
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3", "--timeout=90", "--max-time=3600"]
    healthcheck:
      test: ["CMD", "php", "/usr/local/bin/nutritreino-healthcheck.php", "queue"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 100s
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: nutritreino-web:local
    build:
      context: ./web
      args:
        VITE_API_ORIGIN: ${VITE_API_ORIGIN:-}
        VITE_PUSHER_APP_KEY: ${PUSHER_APP_KEY:-}
        VITE_PUSHER_APP_CLUSTER: ${PUSHER_APP_CLUSTER:-mt1}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  database_data:
  api_storage:
