map $status $upload_cache_control {
    default "no-store";
    200 "public, max-age=86400";
    206 "public, max-age=86400";
    304 "public, max-age=86400";
}

map $status $asset_cache_control {
    default "no-store";
    200 "public, max-age=31536000, immutable";
    206 "public, max-age=31536000, immutable";
    304 "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve o IP do container da API quando ele for recriado.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $api_upstream api:8080;

    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Uploads belong to the API; do not let the static-asset regex override this route.
    location ^~ /storage/ {
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Successful uploads may be cached; errors must never get an immutable TTL.
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        expires off;
        add_header Cache-Control $upload_cache_control always;
    }

    location = /up {
        proxy_pass http://$api_upstream/up;
    }

    location ~* \.(?:css|js|mjs|jpg|jpeg|png|gif|ico|svg|webp|woff2?)$ {
        try_files $uri =404;
        expires off;
        add_header Cache-Control $asset_cache_control always;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
